<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Projects by Karan Bhandari." />
    <title>Projects — Karan Bhandari</title>
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/theme.ts"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="site-title" href="/">Karan Bhandari</a>
        <div class="header-controls">
          <nav class="site-nav" aria-label="Primary">
            <ul>
              <li><a href="/">Home</a></li>
              <li><a href="/projects/" aria-current="page">Projects</a></li>
            </ul>
          </nav>
          <button
            id="theme-toggle"
            type="button"
            aria-label="Toggle color theme"
          >
            Theme
          </button>
        </div>
      </header>

      <main>
        <h1>Projects</h1>
        <ul class="project-list">
          <li>
            <a href="https://kbkaran.com/f1-pitwall/">
              <span>F1 Pitwall</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a href="https://kbkaran.com/paper-trail">
              <span>Papertrail</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
