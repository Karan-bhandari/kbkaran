<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Karan Bhandari — math, stats, machine learning, and sports data."
    />
    <title>Karan Bhandari</title>
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/theme.ts"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="site-title" href="/">Karan Bhandari</a>
        <div class="header-controls">
          <nav class="site-nav" aria-label="Primary">
            <ul>
              <li><a href="/" aria-current="page">Home</a></li>
              <li><a href="/projects/">Projects</a></li>
            </ul>
          </nav>
          <button
            id="theme-toggle"
            type="button"
            aria-label="Toggle color theme"
          >
            Theme
          </button>
        </div>
      </header>

      <main>
        <h1 class="sr-only">Karan Bhandari</h1>
        <section>
          <p>
            I like math, stats, machine learning, and messing around with sports
            data.

          <p>
            This is a place to dump random things I find on the internet and
            share whatever I'm working on.
          </p>
        </section>

        <nav class="social-links" aria-label="Links">
          <a href="https://github.com/Karan-bhandari" rel="me noreferrer"

          >
          <a href="https://www.linkedin.com/in/kmbhandari/" rel="me noreferrer"
            >LinkedIn</a
          >
          <!-- <a href="https://bsky.app/profile/kbkaran.com" rel="me noreferrer">Bluesky</a> -->
