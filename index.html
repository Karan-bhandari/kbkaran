<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Karan Bhandari — math, stats, machine learning, and sports data.">
  <title>Karan Bhandari</title>
  <script>
    (() => {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    })();
  </script>
  <style>
    /* Flexoki palette using native CSS light-dark() */
    :root {
      color-scheme: light dark;
      --bg: light-dark(#FFFCF0, #100F0F);
      --surface: light-dark(#F2F0E5, #1C1B1A);
      --fg: light-dark(#100F0F, #CECDC3);
      --muted: light-dark(#6F6E69, #878580);
      --border: light-dark(#E6E4D9, #282726);
      --accent: light-dark(#24837B, #3AA99F);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.5rem;
      box-sizing: border-box;
      background-color: var(--bg);
      color: var(--fg);
      font: 1rem/1.65 system-ui, -apple-system, sans-serif;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    main {
      width: 100%;
      max-width: 38rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }
    #theme-toggle {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font: inherit;
      font-size: 0.8125rem;
      cursor: pointer;
    }
    #theme-toggle:hover {
      color: var(--fg);
      border-color: var(--muted);
    }
    section {
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    p { margin: 0 0 1rem; }
    p:last-child { margin-bottom: 0; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    a {
      color: var(--fg);
      text-decoration-color: var(--accent);
      text-underline-offset: 0.25em;
    }
    a[href]:hover {
      color: var(--accent);
    }
    a:not([href]) {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Karan Bhandari</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle color theme">Theme</button>
    </header>

    <section>
      <p>
        I like math, stats, machine learning, and messing around
        with sports data.
      </p>
      <p>
        This is a place to dump random things I find on the internet and share
        whatever I'm working on.
      </p>
    </section>

    <nav aria-label="Links">
      <a href="https://github.com/Karan-bhandari" rel="me noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/kmbhandari/" rel="me noreferrer">LinkedIn</a>
      <!-- <a href="https://bsky.app/profile/kbkaran.com" rel="me noreferrer">Bluesky</a> -->
      <a>Email</a>
    </nav>
  </main>

  <script>
    const btn = document.getElementById("theme-toggle");
    const root = document.documentElement;
    const isDark = () =>
      root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
    const syncLabel = () => {
      btn.textContent = isDark() ? "Light" : "Dark";
    };
    syncLabel();
    btn.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      root.dataset.theme = next;
      localStorage.setItem("theme", next);
      syncLabel();
    });
  </script>
</body>
</html>
